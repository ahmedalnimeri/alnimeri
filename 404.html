<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Ahmed El-Nimeri</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<!-- Root-relative on purpose: Pages serves this document at the URL that was
     requested, so a relative href resolves against /some/missing/path/ and
     404s in turn — leaving an unstyled error page. -->
<link rel="stylesheet" href="/styles.css?v=48">
<style>
  .lost {
    position: relative; z-index: 1;
    min-height: 100svh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 6rem var(--gut);
  }
  .lost__code { margin: 0 0 1.5rem; font-size: 0.78rem; font-weight: 500; color: var(--fg-faint); }
  .lost__title {
    margin: 0; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05;
    font-size: clamp(2rem, 6vw, 4.5rem);
  }
  .lost__body { margin: 1.25rem 0 2.25rem; color: var(--fg-dim); max-width: 42ch; }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="lost">
  <p class="lost__code">404</p>
  <h1 class="lost__title">This page doesn’t exist.</h1>
  <p class="lost__body">The link may be out of date, or the page may have moved.
    Everything worth seeing is on the front page.</p>
  <a class="btn btn--solid" href="/">Back to the work</a>
</main>
</body>
</html>
